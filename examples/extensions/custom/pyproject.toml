[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "outctl-example-custom-extension"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["outctl"]

[project.entry-points."outctl.extensions.v1"]
custom-summary = "outctl_example_custom:extension"

[tool.hatch.build.targets.wheel]
packages = ["src/outctl_example_custom"]
