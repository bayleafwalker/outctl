[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "outctl"
version = "0.1.0.dev0"
description = "Bounded, recoverable command-output capture and projection"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Juha Huotari" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.scripts]
outctl = "outctl.cli:main"

[project.optional-dependencies]
test = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/outctl"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "outctl/schemas"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["outctl"]
