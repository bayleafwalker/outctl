schema_version: vuoro.outctl.policy-source/v1
policy_ref: policy://interactive-w5
cache:
  max_age_ms: 3600000
sinks:
  - name: model
    trust_domain: trusted-local
    disclosure: safe-unredacted
    redaction_required: false
    classification_ceiling: secret
  - name: handoff
    trust_domain: restricted
    disclosure: sanitized
    redaction_required: true
    classification_ceiling: confidential
  - name: audit-receipt
    trust_domain: metadata-only
    disclosure: metadata-only
    redaction_required: true
    classification_ceiling: internal
  - name: runner
    trust_domain: export
    disclosure: deny
    redaction_required: true
    classification_ceiling: public
capture:
  commitment: host-persistent
  durability: host
  required: true
