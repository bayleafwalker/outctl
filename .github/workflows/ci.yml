name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv build
      - run: python -m json.tool outctl.dispatch.json >/dev/null
