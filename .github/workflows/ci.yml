name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv build
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: python -m json.tool outctl.dispatch.json >/dev/null

  package:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv build
      - run: uv run pytest tests/test_packaging.py
      - run: uv run python scripts/check_package.py
      - run: |
          install_root="$(mktemp -d)"
          uv venv --python 3.12 "$install_root/.venv"
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          uv pip install --python "$install_root/.venv/bin/python" "$wheel"
          "$install_root/.venv/bin/outctl" --version
          "$install_root/.venv/bin/python" -c 'import outctl.control, outctl.native'

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.1
          components: rustfmt
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: uv run pytest tests/test_native_capabilities.py
